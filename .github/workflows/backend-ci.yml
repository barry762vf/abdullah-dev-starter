name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abdullah_core_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d abdullah_core_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Test-only values: the dedicated *_test database guard rejects anything else.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/abdullah_core_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Fast tests (no database)
        run: python -m pytest -m unit -q
      - name: Full suite with coverage (includes migration round-trip, drift check and lock)
        run: python -m pytest -q --cov --cov-report=term
