[project]
name = "abdullah-dev-core-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Abdullah Developer Core"
requires-python = ">=3.11"

# requirements.txt and requirements-dev.txt pin installable dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Applied by folder in tests/conftest.py. Fast run without PostgreSQL: pytest -m unit
markers = [
    "unit: no database needed (tests/unit, tests/api)",
    "integration: needs the dedicated *_test PostgreSQL database (tests/integration)",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs ORM code in greenlets; without this, executed lines look missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Reported, not enforced: use it to find untested behavior, not as a target.
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
